<style>

textarea{all:unset;display:block;width:100%;min-height:120px;background:var(--s2);border-radius:16px;padding:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-all}
textarea::placeholder{color:var(--fa)}
.pv{margin-top:10px}
.mi{display:flex;align-items:center;gap:14px;width:100%;height:54px;font-size:16px;text-align:left;border-radius:14px;padding:0 6px}.mi:active{background:var(--s2)}.mi.red{color:#FF8A8A}.mi svg{color:var(--mu)}
.mh{padding:2px 6px 14px}.mh b{font-size:18px;font-weight:600}.mh div{font-size:13px;color:var(--mu);margin-top:4px}
.inp{all:unset;box-sizing:border-box;display:block;width:100%;background:var(--s2);border-radius:14px;padding:14px;font-size:18px;margin-top:6px}
.snack{position:fixed;left:24px;right:24px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;justify-content:space-between;background:#26262B;border-radius:16px;padding:0 8px 0 18px;height:50px;font-size:14px;opacity:0;transform:translateY(20px) scale(.97);pointer-events:none;transition:all .45s var(--sp);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.snack.on{opacity:1;transform:none;pointer-events:auto}.snack button{color:var(--ac);font-weight:600;padding:0 12px;height:40px}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--mu)}.spin{animation:rot .9s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:36px}#lock.on{display:flex}
</style></head><body>
<header><img class="av" src="avatar.jpg" alt="" onclick="openSettings()"><div class="ttl" id="ttl">Vault</div><button class="ib" onclick="toggleSearch()" aria-label="Search"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6.5"/><path d="m14 14 4.5 4.5"/></svg></button></header>

<script>
const CATS=[['Food','🍜'],['Groceries','🛒'],['Transport','🚇'],['Shopping','🛍️'],['Subscription','🔁'],['Entertain','🎬'],['Health','💊'],['Education','📚'],['Bills','🧾'],['Other','💳']];
const EM=Object.fromEntries(CATS);
const $=id=>document.getElementById(id);
const LS=k=>JSON.parse(localStorage.getItem('vault.'+k)||'null'),SS=(k,v)=>localStorage.setItem('vault.'+k,JSON.stringify(v));
let server=null,st=Object.assign({budget:2500,edits:{},deleted:{},manual:[]},LS('state')||{});if(!st.b25){st.budget=2500;st.b25=1;SS('state',st)}
let view='home',query='',filt=null,cycOff=0,selDay=null,showAll=false;
const save=()=>SS('state',st);
const buzz=(n=8)=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const f2=n=>(n<0?'−':'')+'A$'+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const f0=n=>'A$'+Math.round(n).toLocaleString('en-AU');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date()),D0=()=>new Date(new Date().toDateString());
function cycleOf(o=0){const n=new Date();let m=n.getMonth();if(n.getDate()<28)m--;m+=o;const s=new Date(n.getFullYear(),m,28),e=new Date(n.getFullYear(),m+1,28);return{s:ymd(s),e:ymd(e),sd:s,ed:e}}
const days=(a,b)=>Math.round((b-a)/864e5);
const fd=s=>new Date(s+'T00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
function dayT(s){const d=days(new Date(s+'T00:00'),D0());return d==0?'Today':d==1?'Yesterday':new Date(s+'T00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'})}
function all(){if(!server)return[];const m=new Map();for(const t of server.transactions)m.set(t.id,{...t,src:'bank'});
 const bk=new Set(server.transactions.map(t=>t.date+t.merchant+t.amount+t.type));
 for(const t of st.manual){if(t.id[0]=='s'&&bk.has(t.date+t.merchant+t.amount+t.type))continue;m.set(t.id,{...t})}
 const o=[];for(const[id,t]of m){if(st.deleted[id]||t.voided)continue;o.push(Object.assign(t,st.edits[id]||{}))}
 return o.sort((a,b)=>b.date.localeCompare(a.date)||(b.seq||0)-(a.seq||0))}
const inC=(t,c)=>t.date>=c.s&&t.date<c.e;
const NM={TFNSW:'Opal (TfNSW)',MCDONA:'McDonald\'s',HURRIC:'Hurricane\'s',WOOLWO:'Woolworths',CHEMIS:'Chemist',PHARMA:'Pharmacy',HUNGRY:'Hungry Jack\'s',VODAFO:'Vodafone',PAYPAL:'PayPal',UBER:'Uber',COLES:'Coles',UMALL:'Umall'};
const nice=m=>NM[m.replace(/[\s*]+$/,'').toUpperCase()]||m.replace(/\s*\*\s*$/,'').replace(/^(\w)(\w*)$/,(_,a,b)=>a+b.toLowerCase());
const label=t=>t.desc||(t.merchant?nice(t.merchant):t.type=='refund'?'Refund':'Card payment');
// parser
const RULES=[[/MCDONA|HUNGRY|MAMAK|HONGTA|HANU|HURRIC|CHEFS|ZENGO|STELLI|KFC|SUSHI/,'Food',0],[/COLES|WOOLWO|UMALL|ALDI|IGA/,'Groceries',0],[/UBER|TFNSW|OPAL|DIDI/,'Transport',0],[/CHEMIS|PHARMA|PRICELINE/,'Health',0],[/VODAFO|OPTUS|TELSTRA/,'Bills',0],[/HYATT|GATHER|JR MOC|DL SUN|SUNGRO/,'Food',1],[/IGLU/,'Bills',1],[/PAYPAL|WWW\./,'Shopping',1]];
function cat(m){if(!m)return['Subscription',1];for(const[r,c,u]of RULES)if(r.test(m.toUpperCase()))return[c,u];return['Other',1]}
const DR='(\\d{4})年(\\d{1,2})月(\\d{1,2})日';
function parseOne(t){if(/验证码|校验码|交易码|Enter the code/.test(t))return null;let m,o;const dd=(y,a,b)=>`${y}-${a.padStart(2,'0')}-${b.padStart(2,'0')}`;
 if(m=t.match(new RegExp('信用卡(\\d{4}).*?于'+DR+'[，,]?(?:在(.+?))?(消费|撤销)([A-Z]{3})([\\d.]+)元')))o={date:dd(m[2],m[3],m[4]),merchant:(m[5]||'').trim(),type:m[6]=='撤销'?'refund':'purchase',currency:m[7],amount:+m[8]};
 else if(m=t.match(new RegExp('信用卡(\\d{4}).*?于'+DR+'(.+?)预授权([A-Z]{3})([\\d.]+)元')))o={date:dd(m[2],m[3],m[4]),merchant:m[5].trim(),type:'preauth',currency:m[6],amount:+m[7]};
 else if(m=t.match(new RegExp('信用卡(\\d{4})于'+DR+'(成功退货|首次交易)([A-Z]{3})([\\d.]+)元')))o={date:dd(m[2],m[3],m[4]),merchant:'',type:m[5]=='成功退货'?'refund':'purchase',currency:m[6],amount:+m[7]};

function openBudget(){sheet(`<div class="mh"><b>Cycle budget</b><div>Each cycle runs from the 28th to the 28th.</div></div><input class="inp num" id="bIn" inputmode="decimal" value="${st.budget}"><button class="cta" onclick="st.budget=parseFloat($('bIn').value)||st.budget;save();closeSheet();render();snack('Budget set to '+f0(st.budget))">Save</button>`)}
function openSettings(){sheet(`<div class="mh"><b>Vault</b><div>${server?.generated?'Synced from iMessage '+server.generated.replace('T',' '):'Not synced yet'}</div></div>
 <button class="mi" onclick="openBudget()">${ic('<circle cx="10" cy="10" r="7"/><path d="M10 6v8M7.5 8.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.6c0 2.4-5 1-5 3.4 0 1 1 1.5 2.5 1.5s2.5-.5 2.5-1.5"/>')} Budget · ${f0(st.budget)}</button>
 <button class="mi" onclick="closeSheet();refresh().then(()=>snack('Up to date'))">${ic('<path d="M16 10a6 6 0 1 1-2-4.5M16 3v3h-3"/>')} Sync now</button>
 ${window.PublicKeyCredential?`<button class="mi" onclick="fidToggle()">${ic('<path d="M3 7V5a2 2 0 0 1 2-2h2M13 3h2a2 2 0 0 1 2 2v2M17 13v2a2 2 0 0 1-2 2h-2M7 17H5a2 2 0 0 1-2-2v-2M8 8v1M12 8v1M10 8v3"/>')} Face ID · ${LS('fid')?'On':'Off'}</button>`:''}
 <button class="mi red" onclick="lockNow()">${ic('<rect x="4" y="9" width="12" height="8" rx="2"/><path d="M7 9V6a3 3 0 0 1 6 0v3"/>')} Lock now</button>`)}
// add sheet
let A={v:'',cat:'Food',date:today(),eid:null,sms:false};
function openAdd(eid){const t=eid&&find(eid);A={v:t?String(Math.abs(t.amount)):'',cat:t?t.category:'Food',date:t?t.date:today(),eid:eid||null,sms:false,desc:t?label(t):''};drawAdd();$('sheet').classList.add('on');$('scrim').classList.add('on');buzz(8)}
function drawAdd(){if(A.sms){$('sheet').innerHTML=`<div class="grab"></div><div class="mh" style="display:flex;justify-content:space-between;align-items:center"><b>Paste bank SMS</b><button class="chip" onclick="A.sms=false;drawAdd()">Keypad</button></div><textarea id="sms" placeholder="Paste one or more Bank of China messages"></textarea><div class="pv" id="pv"></div><button class="cta" id="go" disabled onclick="addSms()">Add</button>`;$('sms').oninput=pv;setTimeout(()=>$('sms').focus(),350);return}
 const [i,d]=(A.v||'0').split('.');const dl=[[today(),'Today'],[ymd(new Date(D0()-864e5)),'Yesterday']];
 $('sheet').innerHTML=`<div class="grab"></div><div class="disp num ${A.v?'':'z'}" id="disp">A$${Number(i).toLocaleString('en-AU')}${A.v.includes('.')?`<span class="c">.${d}</span>`:''}</div>
 <input class="desc" id="desc" placeholder="Add a note" value="${esc(A.desc||'')}">
 <div class="mrow">${dl.map(([s,l])=>`<button class="chip ${A.date==s?'on':''}" onclick="A.date='${s}';A.desc=$('desc').value;drawAdd()">${l}</button>`).join('')}<label class="chip ${dl.some(x=>x[0]==A.date)?'':'on'}" style="display:grid;place-items:center;position:relative">${dl.some(x=>x[0]==A.date)?'Pick date':fd(A.date)}<input type="date" value="${A.date}" style="position:absolute;inset:0;opacity:0" onchange="A.date=this.value;A.desc=$('desc').value;drawAdd()"></label>${A.eid?'':`<button class="chip" onclick="A.sms=true;drawAdd()">Paste SMS</button>`}</div>
 <div class="hs">${CATS.map(([k,e])=>`<button class="chip ${k==A.cat?'on':''}" onclick="A.cat='${k}';A.desc=$('desc').value;buzz(5);drawAdd()">${e} ${k}</button>`).join('')}</div>
 <div class="kp">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}</div>
 <button class="cta" ${parseFloat(A.v)>0?'':'disabled'} onclick="saveAdd()">${A.eid?'Save':'Add expense'}</button>`;
 const hc=$('sheet').querySelector('.hs .on');hc&&hc.scrollIntoView({inline:'center',block:'nearest'})}
function key(k){buzz(4);A.desc=$('desc').value;let v=A.v;if(k=='⌫')v=v.slice(0,-1);else if(k=='.'){if(!v.includes('.'))v=(v||'0')+'.'}else{if(/\.\d\d$/.test(v)||v.replace('.','').length>=7)return;v=v=='0'?k:v+k}A.v=v;drawAdd()}
function saveAdd(){const ch={amount:parseFloat(A.v),date:A.date,desc:$('desc').value.trim()||'',category:A.cat,uncertain:false};
 if(A.eid){const m=st.manual.find(t=>t.id==A.eid);if(m)Object.assign(m,ch);else st.edits[A.eid]=Object.assign(st.edits[A.eid]||{},ch);snack('Saved')}
 else{ch.desc=ch.desc||A.cat;st.manual.push({...ch,id:'m'+Date.now(),type:'purchase',seq:Date.now()});snack('Added '+f2(ch.amount))}save();closeSheet();render();buzz(12)}
function pv(){const p=parseSms($('sms').value);$('pv').innerHTML=p.map(o=>`<div class="tx" style="padding:10px 0"><div class="em">${EM[o.category]}${o.uncertain?'<span class="u"></span>':''}</div><div class="tm"><b>${esc(label(o))}</b><span>${fd(o.date)} · ${o.category}${o.type=='preauth'?' · pending':''}</span></div><div class="am num">${f2(o.amount)}</div></div>`).join('');$('go').disabled=!p.length;$('go').textContent=p.length?`Add ${p.length}`:'Add'}
function addSms(){const p=parseSms($('sms').value),ex=new Set(all().map(t=>t.date+t.merchant+t.amount+t.type));let n=0,s=0;for(const o of p){if(ex.has(o.date+o.merchant+o.amount+o.type)){s++;continue}st.manual.push({...o,id:'s'+Date.now()+n,seq:Date.now()+n});n++}
 save();closeSheet();render();buzz(12);snack(`Added ${n}${s?` · ${s} already there`:''}`)}
// pull to refresh
let py=null,pd=0;addEventListener('touchstart',e=>{py=scrollY<=0&&view=='home'&&!$('sheet').classList.contains('on')?e.touches[0].clientY:null},{passive:true});
addEventListener('touchmove',e=>{if(py==null)return;pd=Math.max(0,e.touches[0].clientY-py);$('ptr').style.height=Math.min(56,pd*.4)+'px';$('ptr').style.opacity=Math.min(1,pd/130);$('ptr').innerHTML=pd>130?'Release to sync':'Pull to sync'},{passive:true});
addEventListener('touchend',async()=>{if(py==null)return;py=null;if(pd>130){$('ptr').innerHTML='<svg class="spin" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 2a8 8 0 1 0 8 8"/></svg>';buzz();await refresh();snack('Up to date')}$('ptr').style.transition='height .35s var(--ez)';$('ptr').style.height=0;setTimeout(()=>$('ptr').style.transition='',350);pd=0});
// data
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// ---- keys: passphrase -> PBKDF2 raw key K (bound to salt+iter); K is cached only non-extractable (IDB) or PRF-wrapped ----
const u8=b=>new Uint8Array(b),tb64=b=>btoa(String.fromCharCode(...u8(b)));
const kid=e=>e.salt+'|'+e.iter;
async function deriveRaw(enc,pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},k0,256)}
const impK=(raw,ext=false)=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},ext,['decrypt','encrypt']);
async function decWith(enc,key){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.ct))))}
const idb=(mode,fn)=>new Promise((res,rej)=>{const r=indexedDB.open('vault',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const t=r.result.transaction('k',mode),q=fn(t.objectStore('k'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}});
const idbGet=k=>idb('readonly',s=>s.get(k)),idbPut=(k,v)=>idb('readwrite',s=>s.put(v,k)),idbDel=k=>idb('readwrite',s=>s.delete(k));
let KEY=null; // live CryptoKey for current ENC
let ENC=null,locked=true,lastRaw=null;
async function openData(){server=await decWith(ENC,KEY);locked=false;$('lock').classList.remove('on');render()}
// ---- Face ID (WebAuthn) ----
const RP=location.hostname; /* 7u717.github.io in production */ const PRFSALT=new TextEncoder().encode('vault-prf-v1');
async function fidAssert(fid){const opt={publicKey:{challenge:crypto.getRandomValues(u8(32)),rpId:RP,allowCredentials:[{type:'public-key',id:b64(fid.id),transports:['internal','hybrid']}],userVerification:'required',timeout:60000}};
 if(fid.mode=='prf')opt.publicKey.extensions={prf:{eval:{first:PRFSALT}}};const a=await navigator.credentials.get(opt);return a.getClientExtensionResults().prf?.results?.first}
async function prfKey(out){const b=await crypto.subtle.importKey('raw',out,'HKDF',false,['deriveKey']);return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:PRFSALT,info:new TextEncoder().encode('wrap')},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function storeKey(raw){// cache K for this device according to Face ID mode
 const fid=LS('fid');if(fid&&fid.mode=='prf'&&fid._wk){const iv=crypto.getRandomValues(u8(12));fid.w={kid:kid(ENC),iv:tb64(iv),ct:tb64(await crypto.subtle.encrypt({name:'AES-GCM',iv},fid._wk,raw))};delete fid._wk;SS('fid',fid);return}
 await idbPut('K',{kid:kid(ENC),key:await impK(raw)})}
async function fidSetup(){const raw=lastRaw;if(!raw)return snack('Unlock with passphrase first');
 try{const c=await navigator.credentials.create({publicKey:{rp:{name:'Vault',id:RP},user:{id:crypto.getRandomValues(u8(16)),name:'7u',displayName:'7u · Vault'},challenge:crypto.getRandomValues(u8(32)),
  pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'preferred',userVerification:'required'},timeout:60000,extensions:{prf:{eval:{first:PRFSALT}}}}});
  const ext=c.getClientExtensionResults();let fid={id:tb64(c.rawId),mode:ext.prf?.enabled?'prf':'gate'};let out=ext.prf?.results?.first;
  if(fid.mode=='prf'&&!out){out=await fidAssert(fid);if(!out)fid.mode='gate'}
  if(fid.mode=='prf'){const wk=await prfKey(out);const iv=crypto.getRandomValues(u8(12));fid.w={kid:kid(ENC),iv:tb64(iv),ct:tb64(await crypto.subtle.encrypt({name:'AES-GCM',iv},wk,raw))};await idbDel('K').catch(()=>{})}
  else await idbPut('K',{kid:kid(ENC),key:await impK(raw)});
  SS('fid',fid);localStorage.removeItem('vault.pw');closeSheet();snack('Face ID is on');buzz(12)}catch(e){snack(e.name=='NotAllowedError'?'Face ID setup cancelled':'Face ID unavailable: '+e.name+' '+e.message)}}
async function fidUnlock(){const fid=LS('fid');if(!fid)return showPw();$('pwErr').textContent='';
 try{const out=await fidAssert(fid);let raw;
  if(fid.mode=='prf'){if(!out)throw{name:'NoPRF'};const wk=await prfKey(out);if(fid.w.kid!=kid(ENC)){fid._wk=wk;window._fid=fid;throw{name:'Rotated'}}raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(fid.w.iv)},wk,b64(fid.w.ct));KEY=await impK(raw)}
  else{const r=await idbGet('K');if(!r||r.kid!=kid(ENC))throw{name:'Rotated'};KEY=r.key}
  await openData();buzz(12)}
 catch(e){if(e.name=='Rotated'){$('pwErr').textContent='Passphrase changed — enter it once more.';showPw()}else if(e.name!='NotAllowedError'){$('pwErr').textContent='Face ID didn’t work. Use your passphrase.';showPw()}}}
function showPw(){$('lkFid').style.display='none';$('lkPw').style.display='block';setTimeout(()=>$('pw').focus(),50)}
function showLock(){$('lock').classList.add('on');const f=LS('fid')&&window.PublicKeyCredential;$('lkFid').style.display=f?'block':'none';$('lkPw').style.display=f?'none':'block';if(f)fidUnlock()}
function fidToggle(){if(LS('fid')){localStorage.removeItem('vault.fid');idbDel('K').catch(()=>{});closeSheet();snack('Face ID is off — passphrase needed next time')}else fidSetup()}
function offerFid(){if(LS('fid')||LS('fidAsked')||!window.PublicKeyCredential)return;PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?.().then(ok=>{if(!ok)return;SS('fidAsked',1);
 sheet(`<div class="mh"><b>Unlock with Face ID?</b><div>Skip the passphrase next time. Your data stays encrypted; the key is protected by Face ID on this phone.</div></div><button class="cta" onclick="fidSetup()">Turn on Face ID</button><button onclick="closeSheet()" style="display:block;margin:14px auto 0;color:var(--mu);font-size:14px">Not now</button>`)})}
function lockNow(){closeSheet();server=null;KEY=null;locked=true;render();showLock()}
async function refresh(){try{ENC=await(await fetch('data.enc.json?'+Date.now(),{cache:'no-store'})).json();SS('enc',ENC)}catch(e){ENC=ENC||LS('enc')}
 if(!ENC){server={transactions:[]};render();return}if(locked)return;
 try{await openData()}catch(e){// new salt/iter (passphrase rotated) -> need passphrase again
  locked=true;server=null;render();$('pwErr').textContent='Passphrase changed — enter it once more.';$('lock').classList.add('on');showPw()}}
async function unlock(){const pw=$('pw').value;$('pwErr').textContent='Unlocking…';try{const raw=await deriveRaw(ENC,pw);KEY=await impK(raw);await openData();lastRaw=raw;$('pw').value='';$('pwErr').textContent='';
  const fid=LS('fid');if(fid){if(fid.mode=='prf'){if(window._fid){fid._wk=window._fid._wk;window._fid=null}else{try{fid._wk=await prfKey(await fidAssert(fid))}catch(e){}}}await storeKey(raw).catch(()=>{})}
  else{await idbPut('K',{kid:kid(ENC),key:await impK(raw)}).catch(()=>{});setTimeout(offerFid,900)}buzz(12)}
 catch(e){$('pwErr').textContent='That passphrase didn’t work.';buzz(30)}}
$('pw').onkeydown=e=>{if(e.key=='Enter')unlock()};
(async()=>{render();ENC=LS('enc');try{ENC=await(await fetch('data.enc.json?'+Date.now(),{cache:'no-store'})).json();SS('enc',ENC)}catch(e){}
 if(!ENC){server={transactions:[]};render();return}
 const legacy=LS('pw');if(legacy){try{const raw=await deriveRaw(ENC,legacy);KEY=await impK(raw);await openData();lastRaw=raw;localStorage.removeItem('vault.pw');await idbPut('K',{kid:kid(ENC),key:await impK(raw)}).catch(()=>{});setTimeout(offerFid,900);return}catch(e){localStorage.removeItem('vault.pw')}}
 if(!LS('fid')){try{const r=await idbGet('K');if(r&&r.kid==kid(ENC)){KEY=r.key;await openData();setTimeout(offerFid,900);return}}catch(e){}}
 showLock()})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(r=>r.update());
</script></body></html>
