<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault"><meta name="theme-color" content="#000"><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Vault</title>
<style>
:root{--card:linear-gradient(160deg,#1c1d22,#121316);--bd:rgba(255,255,255,.09);--mut:#8b8d94;--blue:#9cc3ff;--pill:rgba(80,120,180,.18);--pillbd:rgba(130,170,230,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 22px 12px;background:rgba(0,0,0,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
header h1{font-size:19px;font-weight:700;position:absolute;left:50%;transform:translateX(-50%)}
.av{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4b5d7e,#15181f);display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:14px}
.ring{width:42px;height:42px;position:relative;display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:16px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
main{padding:16px 22px}
.page{display:none;animation:in .35s cubic-bezier(.2,.8,.2,1)}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h2.big{font-size:40px;font-weight:800;margin:4px 0 16px;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:22px;margin-bottom:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.lab{font-size:12px;font-weight:700;letter-spacing:.28em;color:var(--mut);text-transform:uppercase}
.tile .lab{font-size:9.5px;letter-spacing:.16em}
.pill{display:inline-flex;align-items:center;padding:7px 14px;border-radius:999px;background:var(--pill);border:1px solid var(--pillbd);color:var(--blue);font-weight:700;font-size:14px;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.huge{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1}.huge sup{font-size:22px;vertical-align:28px;margin-right:4px}.huge small{font-size:22px;color:var(--mut);letter-spacing:0}
.bar{height:9px;border-radius:9px;background:#2a2b30;margin:22px 0 18px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#5d8fd6,#9cc3ff);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar i.warn{background:linear-gradient(90deg,#d6875d,#ff9c9c)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.tile{background:linear-gradient(150deg,#24262c,#17181c);border:1px solid var(--bd);border-radius:18px;padding:13px 14px}
.tile b{display:block;font-size:19px;font-weight:800;margin-top:6px}
.goal{margin-top:12px;display:flex;align-items:center;justify-content:space-between}
.goal .t{font-weight:700;font-size:16px}.goal .s{font-size:12.5px;color:var(--mut);margin-top:3px}
.inp{background:linear-gradient(150deg,#2a2d34,#1b1d22);border:1px solid var(--pillbd);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:800}
.inp input{all:unset;width:70px;text-align:right;font-size:20px;color:var(--blue);font-weight:800}
.tx{position:relative;overflow:hidden;border-radius:16px;margin-top:8px}
.tx .act{position:absolute;inset:0;display:flex;justify-content:flex-end}
.tx .act button{border:0;width:76px;font-weight:700;color:#fff;font-size:13px}
.tx .act .e{background:#3b5a8a}.tx .act .d{background:#c2413c}
.tx .fg{position:relative;background:#18191d;display:flex;align-items:center;gap:12px;padding:12px;transition:transform .25s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.ic{width:40px;height:40px;border-radius:12px;background:#24262c;display:grid;place-items:center;font-size:20px;flex:none;position:relative}
.ic .q{position:absolute;right:-5px;top:-6px;font-size:12px}
.tx .m{flex:1;min-width:0}.tx .m div{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx .m span{font-size:12px;color:var(--mut)}
.amt{font-weight:800;font-size:16px}.amt.neg{color:#7fe0a5}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;background:#3a3020;color:#f3c77a;margin-left:6px;font-weight:700;vertical-align:1px}
.empty{color:var(--mut);text-align:center;font-weight:700;padding:30px 0}
.more{display:block;margin:14px auto 0;background:none;border:0;color:var(--blue);font-weight:700;font-size:14px}
textarea,.field input{all:unset;display:block;width:100%;font-size:17px;font-weight:700;color:#fff}
textarea{min-height:64px;font-size:15px;line-height:1.4}
.field{background:linear-gradient(150deg,#222429,#16171b);border:1px solid var(--bd);border-radius:18px;padding:12px 16px;margin-top:12px}
.field .lab{font-size:10px;letter-spacing:.2em;display:block;margin-bottom:6px}
.field input::placeholder,textarea::placeholder{color:#777}
.cat{background:linear-gradient(150deg,#222429,#16171b);border:1px solid var(--bd);border-radius:16px;padding:12px 2px;text-align:center;font-size:11.5px;font-weight:700;color:#bbb;transition:all .15s}
.cat em{display:block;font-style:normal;font-size:24px;margin-bottom:5px}.cat.on{border-color:var(--pillbd);background:linear-gradient(150deg,#2b3646,#1b222c);color:var(--blue)}
.btn{display:block;width:100%;margin-top:16px;border:0;border-radius:18px;padding:16px;font-size:17px;font-weight:800;color:#0a0f18;background:linear-gradient(90deg,#a9b4c4,#6f9bd8)}
.btn:disabled{opacity:.35}
.prev{margin-top:12px;font-size:14px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:space-around;align-items:center;padding:12px 30px calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.07)}
nav button{all:unset;width:64px;height:52px;display:grid;place-items:center;color:#777;transition:transform .15s}
nav button.on{color:var(--blue)}nav .plus{border-radius:18px;background:#1c1d21;border:1px solid var(--bd);color:#ddd}
nav .plus.on{box-shadow:0 0 30px rgba(120,170,255,.25);color:var(--blue)}
.press{transition:transform .12s}.press:active{transform:scale(.95)}
.chart{position:relative;height:200px;display:flex;align-items:flex-end;gap:3px;margin-top:16px;padding-left:44px;border-bottom:1px solid #333}
.chart .y{position:absolute;left:0;font-size:11px;color:var(--mut);transform:translateY(50%)}
.chart .gl{position:absolute;left:44px;right:0;border-top:1px solid rgba(255,255,255,.06)}
.chart .c{flex:1;background:linear-gradient(#9cc3ff,#4d74b0);border-radius:4px 4px 1px 1px;min-height:0;transition:height .7s cubic-bezier(.2,.8,.2,1);position:relative}
.chart .c.fut{background:#202226}.chart .c.sel{background:linear-gradient(#fff,#9cc3ff)}
.xl{display:flex;padding-left:44px;font-size:11px;color:var(--mut);margin-top:6px}.xl span{flex:1;text-align:center;white-space:nowrap}
.cb{margin-top:14px}.cb .row{font-weight:700;font-size:14.5px}.cb .bar{margin:7px 0 0;height:7px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#141518;border-top-left-radius:28px;border-top-right-radius:28px;border:1px solid var(--bd);padding:10px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.on{transform:none}.grab{width:40px;height:5px;border-radius:5px;background:#444;margin:0 auto 14px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:#1f2a3a;border:1px solid var(--pillbd);color:var(--blue);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .3s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cyc{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}.cyc::-webkit-scrollbar{display:none}
.cyc button{flex:none;border:1px solid var(--bd);background:#141518;color:#999;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px}
.cyc button.on{background:var(--pill);border-color:var(--pillbd);color:var(--blue)}
#lock{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column;justify-content:center;padding:40px}
#lock.on{display:flex}
</style></head><body>
<header><div class="av" id="av">7u</div><h1>Vault</h1><div class="ring" id="ring"></div></header>
<main>
<section class="page on" id="p-home">
 <div class="card">
  <div class="lab">Remaining</div>
  <div class="row" style="margin-top:12px"><div class="huge" id="rem"></div><span class="pill press" id="usedPill" onclick="editBudget()"></span></div>
  <div class="bar"><i id="remBar"></i></div>
  <div class="g3"><div class="tile"><div class="lab">Spent</div><b id="spent"></b></div><div class="tile"><div class="lab">Free/day</div><b id="free"></b></div><div class="tile"><div class="lab">Save/day</div><b id="save"></b></div></div>
  <div class="tile goal"><div><div class="t">Savings goal</div><div class="s">How much to keep this cycle</div></div><label class="inp">$ <input id="goal" inputmode="decimal"></label></div>
 </div>
 <div class="card"><div class="row"><div><div class="lab">Recent</div><div style="font-size:26px;font-weight:800;margin-top:8px">Transactions</div></div><span class="pill" id="cnt"></span></div>
  <div id="list"></div><button class="more press" id="moreBtn" onclick="showAll=!showAll;render()"></button></div>
 <div style="text-align:center;color:#555;font-size:12px" id="upd"></div>
</section>
<section class="page" id="p-log">
 <h2 class="big">Log</h2>
 <div class="card"><div class="row"><div><div class="lab">Smart entry</div><div style="font-size:22px;font-weight:800;margin-top:8px">Bank SMS</div></div><span class="pill" id="smsState">ready</span></div>
  <div class="field"><textarea id="sms" placeholder="Paste Bank of China SMS (one or many)"></textarea></div><div class="prev" id="smsPrev"></div>
  <button class="btn press" id="smsAdd" disabled onclick="addSms()">Add from SMS</button></div>
 <div class="card"><div class="lab">Manual</div>
  <div class="g2"><div class="field"><span class="lab">Amount</span><input id="mAmt" inputmode="decimal" placeholder="0.00"></div><div class="field"><span class="lab">Date</span><input id="mDate" type="date" style="text-align:center"></div></div>
  <div class="field"><span class="lab">Description</span><input id="mDesc" placeholder="Description"></div>
  <div class="g4" id="cats" style="margin-top:12px"></div>
  <button class="btn press" onclick="addManual()">Add expense</button></div>
</section>
<section class="page" id="p-stats">
 <h2 class="big">Stats</h2>
 <div class="cyc" id="cyc"></div>
 <div class="card"><div class="lab">Cycle overview</div><div class="huge" style="font-size:52px;margin:12px 0 8px" id="sTot"></div>
  <div class="row"><div style="color:var(--mut);font-weight:700;font-size:14px" id="sRange"></div><span class="pill" id="sPct"></span></div>
  <div class="g2" style="margin-top:14px"><div class="tile"><div class="lab">Avg/day</div><b id="sAvg"></b></div><div class="tile"><div class="lab">High day</div><b id="sHigh"></b></div></div>
  <div class="tile" style="margin-top:12px"><div class="lab">Days left</div><b id="sLeft"></b></div></div>
 <div class="card"><div class="row"><div style="font-size:22px;font-weight:800">Daily spending</div><b style="color:var(--blue)" id="sSel"></b></div>
  <div class="chart" id="chart"></div><div class="xl" id="xl"></div></div>
 <div class="card"><div style="font-size:22px;font-weight:800">By category</div><div id="cb"></div></div>
</section>
</main>
<nav><button class="press on" data-p="home" aria-label="Home"><svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l9-7 9 7v11H4z"/></svg></button>
<button class="press plus" data-p="log" aria-label="Log"><svg width="24" height="24" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="press" data-p="stats" aria-label="Stats"><svg width="28" height="26" stroke="currentColor" stroke-width="2"><path d="M4 23h20M8 19v-8M14 19V5M20 19v-11"/></svg></button></nav>
<div class="sheet-bg" id="sbg" onclick="closeSheet()"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>
<div id="lock"><div style="font-size:34px;font-weight:800">Vault</div><div style="color:var(--mut);margin:8px 0 22px">Enter your passphrase to unlock bank data.</div>
 <div class="field"><input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password"></div>
 <button class="btn press" onclick="unlock()">Unlock</button><div class="prev" id="pwErr"></div></div>
<script>
const CATS=[['Food','🍔'],['Groceries','🛒'],['Transport','🚗'],['Shopping','🛍️'],['Subscription','🔁'],['Entertain','🎮'],['Health','💊'],['Education','📚'],['Bills','📱'],['Other','💰']];
const EMO=Object.fromEntries(CATS);
const $=id=>document.getElementById(id);
const LS=k=>JSON.parse(localStorage.getItem('vault.'+k)||'null'), SS=(k,v)=>localStorage.setItem('vault.'+k,JSON.stringify(v));
let server={transactions:[]}, st=Object.assign({budget:1900,goal:600,edits:{},deleted:{},manual:[]},LS('state')||{}), showAll=false, cycOff=0, sel=null, mCat='Food';
const save=()=>SS('state',st);
const buzz=(n=8)=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)};
const f2=n=>(n<0?'-':'')+'$'+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
function cycleOf(off=0){const n=new Date();let y=n.getFullYear(),m=n.getMonth();if(n.getDate()<28)m--;m+=off;const s=new Date(y,m,28),e=new Date(y,m+1,28);return{s:ymd(s),e:ymd(e),sd:s,ed:e}}
const days=(a,b)=>Math.round((b-a)/864e5);
// ---------- data ----------
function all(){const m=new Map();for(const t of server.transactions)m.set(t.id,{...t,src:'bank'});const bk=new Set(server.transactions.map(t=>t.date+t.merchant+t.amount+t.type));for(const t of st.manual){if(t.id[0]=='s'&&bk.has(t.date+t.merchant+t.amount+t.type))continue;m.set(t.id,{...t})}
 const out=[];for(const [id,t] of m){if(st.deleted[id]||t.voided)continue;out.push(Object.assign(t,st.edits[id]||{}))}
 return out.sort((a,b)=>b.date.localeCompare(a.date)||(b.seq||0)-(a.seq||0))}
const inCyc=(t,c)=>t.date>=c.s&&t.date<c.e;
// ---------- SMS parser (mirrors build_data.py) ----------
const RULES=[[/MCDONA|HUNGRY|MAMAK|HONGTA|HANU|HURRIC|CHEFS|ZENGO|STELLI|KFC|SUSHI/,'Food',0],[/COLES|WOOLWO|UMALL|ALDI|IGA/,'Groceries',0],[/UBER|TFNSW|OPAL|DIDI/,'Transport',0],[/CHEMIS|PHARMA|PRICELINE/,'Health',0],[/VODAFO|OPTUS|TELSTRA/,'Bills',0],[/HYATT|GATHER|JR MOC|DL SUN|SUNGRO/,'Food',1],[/IGLU/,'Bills',1],[/PAYPAL|WWW\./,'Shopping',1]];
function cat(m){if(!m)return['Subscription',1];for(const[r,c,u]of RULES)if(r.test(m.toUpperCase()))return[c,u];return['Other',1]}
const D='(\\d{4})年(\\d{1,2})月(\\d{1,2})日';
function parseOne(t){if(/验证码|校验码|交易码|Enter the code/.test(t))return null;let m,o;const dd=(y,mo,d)=>`${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
 if(m=t.match(new RegExp('信用卡(\\d{4}).*?于'+D+'[，,]?(?:在(.+?))?(消费|撤销)([A-Z]{3})([\\d.]+)元')))o={date:dd(m[2],m[3],m[4]),merchant:(m[5]||'').trim(),type:m[6]=='撤销'?'refund':'purchase',currency:m[7],amount:+m[8]};
 else if(m=t.match(new RegExp('信用卡(\\d{4}).*?于'+D+'(.+?)预授权([A-Z]{3})([\\d.]+)元')))o={date:dd(m[2],m[3],m[4]),merchant:m[5].trim(),type:'preauth',currency:m[6],amount:+m[7]};
 else if(m=t.match(new RegExp('信用卡(\\d{4})于'+D+'(成功退货|首次交易)([A-Z]{3})([\\d.]+)元')))o={date:dd(m[2],m[3],m[4]),merchant:'',type:m[5]=='成功退货'?'refund':'purchase',currency:m[6],amount:+m[7]};
 if(!o)return null;if(o.type=='refund'){o.amount=-o.amount;o.category='Other';o.uncertain=false}else{const[c,u]=cat(o.merchant);o.category=c;o.uncertain=!!u}
 if(o.currency!='AUD')o.uncertain=true;return o}
function parseSms(txt){return txt.split(/(?<=【中国银行】)|\n{2,}/).map(s=>s.trim()).filter(Boolean).map(parseOne).filter(Boolean)}
const label=t=>t.desc||t.merchant||(t.type=='refund'?'Refund':'No merchant');
// ---------- render ----------
function ring(left,total){const p=Math.max(0,left/total),r=18,c=2*Math.PI*r;$('ring').innerHTML=`<svg width="42" height="42"><circle cx="21" cy="21" r="${r}" stroke="#23262d" stroke-width="3" fill="none"/><circle cx="21" cy="21" r="${r}" stroke="#9cc3ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" style="transition:stroke-dashoffset .8s"/></svg>${left}`}
function txRow(t){const neg=t.amount<0;return `<div class="tx" data-id="${t.id}"><div class="act"><button class="e" onclick="openEdit('${t.id}')">Edit</button><button class="d" onclick="del('${t.id}')">Delete</button></div>
 <div class="fg"><div class="ic press" onclick="openCat('${t.id}')">${EMO[t.category]||'💰'}${t.uncertain?'<span class="q">❓</span>':''}</div><div class="m"><div>${esc(label(t))}${t.type=='preauth'?'<span class="tag">PRE-AUTH</span>':''}${t.currency&&t.currency!='AUD'?'<span class="tag">'+t.currency+'</span>':''}</div><span>${fmtD(t.date)} · ${t.category}${t.src=='bank'?'':' · manual'}</span></div><div class="amt ${neg?'neg':''}">${neg?'+'+f2(-t.amount):f2(t.amount)}</div></div></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=s=>{const d=new Date(s+'T00:00');return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})};
function render(){const c=cycleOf(0),tx=all(),cur=tx.filter(t=>inCyc(t,c)),spent=cur.reduce((a,t)=>a+t.amount,0);
 const now=new Date(),left=days(new Date(now.getFullYear(),now.getMonth(),now.getDate()),c.ed),total=days(c.sd,c.ed);ring(left,total);
 const rem=st.budget-spent,pct=st.budget?spent/st.budget*100:0,[i,dec]=Math.abs(rem).toFixed(2).split('.');
 $('rem').innerHTML=`<sup>${rem<0?'-':''}$</sup>${Number(i).toLocaleString('en-AU')}<small>.${dec}</small>`;
 $('usedPill').textContent=`${pct.toFixed(0)}% / ${f2(st.budget)}`;$('remBar').style.width=Math.min(100,Math.max(0,100-pct))+'%';$('remBar').className=pct>85?'warn':'';
 $('spent').textContent=f2(spent);$('free').textContent=f2(Math.max(0,(rem-st.goal)/Math.max(1,left)));$('save').textContent=f2(Math.max(0,(st.budget-st.goal)/total));
 if(document.activeElement!==$('goal'))$('goal').value=st.goal;
 $('cnt').textContent=cur.length+' items';const show=showAll?cur:cur.slice(0,8);
 $('list').innerHTML=show.length?show.map(txRow).join(''):'<div class="empty">No expenses yet.</div>';
 $('moreBtn').style.display=cur.length>8?'block':'none';$('moreBtn').textContent=showAll?'Show less':`Show all ${cur.length}`;
 $('upd').textContent=server.generated?'Bank data updated '+server.generated.replace('T',' '):'';bindSwipe();renderStats()}
function renderStats(){const c=cycleOf(cycOff),tx=all().filter(t=>inCyc(t,c)),tot=tx.reduce((a,t)=>a+t.amount,0),n=days(c.sd,c.ed);
 $('cyc').innerHTML=[0,-1,-2,-3,-4,-5].map(o=>{const k=cycleOf(o);return`<button class="${o==cycOff?'on':''}" onclick="cycOff=${o};sel=null;buzz();renderStats()">${fmtD(k.s)} – ${fmtD(k.e)}</button>`}).join('');
 const byDay={};for(const t of tx)byDay[t.date]=(byDay[t.date]||0)+t.amount;const td=today();
 const elapsed=Math.max(1,Math.min(n,days(c.sd,new Date())+1));const hi=Math.max(0,...Object.values(byDay));
 $('sTot').textContent=f2(tot);$('sRange').textContent=tx.length?`${tx.length} transactions · ${fmtD(c.s)} – ${fmtD(c.e)}`:'Paste a bank SMS or add your first expense.';
 $('sPct').textContent=(st.budget?tot/st.budget*100:0).toFixed(0)+'% used';$('sAvg').textContent=f2(tot/elapsed);
 const hd=Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];$('sHigh').textContent=hd?f2(hd[1]):'$0.00';
 const lft=Math.max(0,days(new Date(new Date().toDateString()),c.ed));$('sLeft').textContent=cycOff?'Closed':lft+' days';
 const top=Math.max(10,Math.ceil(hi/50)*50);let h='';for(let k=0;k<=4;k++){h+=`<div class="gl" style="bottom:${k*25}%"></div><div class="y" style="bottom:${k*25}%">$${Math.round(top*k/4)}</div>`}
 let xl='';for(let k=0;k<n;k++){const d=ymd(new Date(c.sd.getFullYear(),c.sd.getMonth(),28+k)),v=Math.max(0,byDay[d]||0);
  h+=`<div class="c ${d>td?'fut':''} ${sel==d?'sel':''}" style="height:${d>td?2:v/top*100}%" onclick="sel='${d}';buzz();renderStats()"></div>`;xl+=`<span>${k%5==0?(+d.slice(5,7))+'/'+(+d.slice(8)):''}</span>`}
 $('chart').innerHTML=h;$('xl').innerHTML=xl;$('sSel').textContent=sel?`${fmtD(sel)} · ${f2(byDay[sel]||0)}`:f2(tot);
 const bc={};for(const t of tx)bc[t.category]=(bc[t.category]||0)+t.amount;const mx=Math.max(1,...Object.values(bc));
 $('cb').innerHTML=Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="cb"><div class="row"><span>${EMO[k]||'💰'} ${k}</span><span>${f2(v)} <span style="color:var(--mut);font-weight:600">${tot?(v/tot*100).toFixed(0):0}%</span></span></div><div class="bar"><i style="width:${Math.max(0,v/mx*100)}%"></i></div></div>`).join('')||'<div class="empty">Nothing yet.</div>'}
// ---------- swipe ----------
let openRow=null;
function bindSwipe(){document.querySelectorAll('.tx .fg').forEach(fg=>{let x0,y0,dx=0,drag=false;
 fg.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;drag=false;fg.style.transition='none';if(openRow&&openRow!==fg){openRow.style.transition='';openRow.style.transform='';openRow=null}},{passive:true});
 fg.addEventListener('touchmove',e=>{const x=e.touches[0].clientX-x0,y=e.touches[0].clientY-y0;if(!drag&&Math.abs(x)>8&&Math.abs(x)>Math.abs(y))drag=true;if(drag){dx=Math.min(0,Math.max(-170,x+(openRow===fg?-152:0)));fg.style.transform=`translateX(${dx}px)`}},{passive:true});
 fg.addEventListener('touchend',()=>{fg.style.transition='';if(!drag)return;if(dx<-60){fg.style.transform='translateX(-152px)';openRow=fg;buzz()}else{fg.style.transform='';openRow=null}});
 fg.addEventListener('contextmenu',e=>{e.preventDefault();openEdit(fg.parentNode.dataset.id)})})}
// ---------- sheets ----------
function sheet(h){$('sheet').innerHTML='<div class="grab"></div>'+h;$('sheet').classList.add('on');$('sbg').classList.add('on');buzz()}
function closeSheet(){$('sheet').classList.remove('on');$('sbg').classList.remove('on')}
const find=id=>all().find(t=>t.id==id);
function catGrid(cur,fn){return '<div class="g4" style="margin-top:12px">'+CATS.map(([k,e])=>`<div class="cat press ${k==cur?'on':''}" onclick="${fn}('${k}')"><em>${e}</em>${k}</div>`).join('')+'</div>'}
let eid=null;
function openCat(id){eid=id;const t=find(id);sheet(`<div class="lab">Category</div><div style="font-size:22px;font-weight:800;margin-top:6px">${esc(label(t))} · ${f2(t.amount)}</div>${t.uncertain?'<div class="prev">❓ Auto-guessed — pick the right one.</div>':''}${catGrid(t.category,'setCat')}`)}
function setCat(k){st.edits[eid]=Object.assign(st.edits[eid]||{},{category:k,uncertain:false});save();closeSheet();render();toast('Category → '+k)}
function openEdit(id){eid=id;const t=find(id);sheet(`<div class="lab">Edit</div><div class="g2"><div class="field"><span class="lab">Amount</span><input id="eAmt" inputmode="decimal" value="${t.amount}"></div><div class="field"><span class="lab">Date</span><input id="eDate" type="date" value="${t.date}"></div></div><div class="field"><span class="lab">Description</span><input id="eDesc" value="${esc(label(t))}"></div>${catGrid(t.category,'pickE')}<button class="btn press" onclick="saveEdit()">Save</button>`);window._ec=t.category}
function pickE(k){window._ec=k;document.querySelectorAll('#sheet .cat').forEach(c=>c.classList.toggle('on',c.textContent.endsWith(k)));buzz(5)}
function saveEdit(){const a=parseFloat($('eAmt').value);if(isNaN(a))return toast('Invalid amount');const ch={amount:a,date:$('eDate').value,desc:$('eDesc').value,category:window._ec,uncertain:false};
 const m=st.manual.find(t=>t.id==eid);if(m)Object.assign(m,ch);else st.edits[eid]=Object.assign(st.edits[eid]||{},ch);save();closeSheet();render();toast('Saved')}
let lastDel=null;
function del(id){st.deleted[id]=1;lastDel=id;save();buzz(15);render();toast('Deleted');}
function editBudget(){sheet(`<div class="lab">Cycle budget</div><div class="field"><span class="lab">AUD</span><input id="bIn" inputmode="decimal" value="${st.budget}"></div><button class="btn press" onclick="st.budget=parseFloat($('bIn').value)||st.budget;save();closeSheet();render();toast('Budget updated')">Save</button>`)}
// ---------- log ----------
$('cats').innerHTML=CATS.map(([k,e])=>`<div class="cat press ${k==mCat?'on':''}" data-k="${k}"><em>${e}</em>${k}</div>`).join('');
$('cats').onclick=e=>{const c=e.target.closest('.cat');if(!c)return;mCat=c.dataset.k;document.querySelectorAll('#cats .cat').forEach(x=>x.classList.toggle('on',x===c));buzz(5)};
$('mDate').value=today();
function addManual(){const a=parseFloat($('mAmt').value);if(!(a>0))return toast('Enter an amount');st.manual.push({id:'m'+Date.now(),date:$('mDate').value||today(),desc:$('mDesc').value||mCat,category:mCat,amount:a,type:'purchase',seq:Date.now()});save();$('mAmt').value='';$('mDesc').value='';buzz(12);render();toast('Added '+f2(a));go('home')}
$('sms').oninput=()=>{const p=parseSms($('sms').value);$('smsAdd').disabled=!p.length;$('smsState').textContent=p.length?p.length+' found':'ready';
 $('smsPrev').innerHTML=p.map(o=>`${EMO[o.category]} ${o.date} · ${esc(o.merchant||'No merchant')} · <b style="color:#fff">${f2(o.amount)}</b> ${o.type=='preauth'?'<span class="tag">PRE-AUTH</span>':''}${o.uncertain?' ❓':''}`).join('<br>')};
function addSms(){const p=parseSms($('sms').value);let n=0;for(const o of p){const key=o.date+o.merchant+o.amount+o.type;if(all().some(t=>t.date+t.merchant+t.amount+t.type==key)&&!confirm(`Looks like a duplicate: ${o.merchant} ${f2(o.amount)}. Add anyway?`))continue;st.manual.push({...o,id:'s'+Date.now()+n,seq:Date.now()+n});n++}
 save();$('sms').value='';$('sms').oninput();buzz(12);render();toast(`Added ${n} from SMS`);if(n)go('home')}
// ---------- nav ----------
function go(p){document.querySelectorAll('.page').forEach(s=>s.classList.toggle('on',s.id=='p-'+p));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==p));scrollTo({top:0});buzz(6)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
$('goal').oninput=e=>{st.goal=parseFloat(e.target.value)||0;save();render()};
// ---------- encrypted data load ----------
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(enc,pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},k,b64(enc.ct))))}
let ENC=null;
async function load(){try{ENC=await (await fetch('data.enc.json?'+Date.now(),{cache:'no-store'})).json()}catch(e){ENC=LS('enc')}
 if(!ENC){render();return}SS('enc',ENC);const pw=LS('pw');if(pw){try{server=await decrypt(ENC,pw);render();return}catch(e){}}$('lock').classList.add('on')}
async function unlock(){try{server=await decrypt(ENC,$('pw').value);SS('pw',$('pw').value);$('lock').classList.remove('on');render();buzz(12)}catch(e){$('pwErr').textContent='Wrong passphrase';buzz(30)}}
$('pw').onkeydown=e=>{if(e.key=='Enter')unlock()};
render();load();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
