<style>

body{min-height:100vh;padding-bottom:calc(60px + env(safe-area-inset-bottom))}

/* menus */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(91,112,131,.4);opacity:0;pointer-events:none;transition:opacity .25s}.scrim.on{opacity:1;pointer-events:auto}
.menu{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#000;border-top-left-radius:16px;border-top-right-radius:16px;padding:8px 0 calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);visibility:hidden;transition:transform .4s var(--sp),visibility 0s .4s;box-shadow:0 0 15px rgba(255,255,255,.2);max-height:85vh;overflow:auto}
.menu.on{transform:none;visibility:visible;transition:transform .4s var(--sp)}.grab{width:36px;height:4px;border-radius:4px;background:#333639;margin:4px auto 10px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:0 20px;height:52px;font-weight:700;font-size:16px;text-align:left}.mi:active{background:var(--hov)}.mi.red{color:#F4212E}
.mh{padding:4px 20px 12px;border-bottom:1px solid var(--ln);margin-bottom:6px}.mh b{font-size:18px;font-weight:800}.mh div{color:var(--mu);font-size:14px;margin-top:2px}

.lift{transform:scale(1.02)!important;background:var(--hov)!important;box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:46}
.snack{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:60;background:var(--bl);color:#fff;border-radius:8px;padding:0 6px 0 16px;height:46px;display:flex;align-items:center;justify-content:space-between;font-weight:500;transform:translateY(140%);opacity:0;pointer-events:none;transition:all .4s var(--sp)}
.snack.on{transform:none;opacity:1;pointer-events:auto}.snack button{font-weight:800;padding:0 12px;height:40px}
#lock{position:fixed;inset:0;z-index:99;background:#000;display:none;flex-direction:column;justify-content:center;padding:32px}#lock.on{display:flex}
#lock h1{font-size:31px;font-weight:800;margin:24px 0 8px}#lock input{all:unset;border:1px solid #333639;border-radius:6px;padding:16px 12px;font-size:17px;margin-top:24px}#lock input:focus{border-color:var(--bl);box-shadow:0 0 0 1px var(--bl)}
.wbtn{height:52px;border-radius:999px;background:var(--tx);color:#000;font-weight:800;font-size:17px;margin-top:20px}
</style></head><body>

 <div class="hd"><div class="av" id="av" onclick="openSettings()">7u</div><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3 6v6c0 5 3.8 9.7 9 10 5.2-.3 9-5 9-10V6l-9-4zm0 4.2 5 2.2v3.6c0 3.2-2.2 6.2-5 6.8-2.8-.6-5-3.6-5-6.8V8.4l5-2.2z"/></svg>Vault</div><button class="ib" onclick="toggleSearch()" aria-label="Search"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="7"/><path d="m15 15 5 5"/></svg></button></div>

 <div id="searchBox" style="display:none"><div class="search"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="m13 13 4 4"/></svg><input id="q" placeholder="Search Vault" enterkeyhint="search"></div></div>

<input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password"><button class="wbtn" onclick="unlock()">Unlock</button><div id="pwErr" style="color:#F4212E;margin-top:12px"></div></div>
<script>
const CATS=[['Food','🍔','#F91880'],['Groceries','🛒','#00BA7C'],['Transport','🚗','#1D9BF0'],['Shopping','🛍️','#FFD400'],['Subscription','🔁','#7856FF'],['Entertain','🎮','#FF7A00'],['Health','💊','#F4212E'],['Education','📚','#00A3A3'],['Bills','📱','#8B98A5'],['Other','💰','#536471']];
const C=Object.fromEntries(CATS.map(c=>[c[0],c]));const ce=k=>(C[k]||C.Other);
const $=id=>document.getElementById(id);
const LS=k=>JSON.parse(localStorage.getItem('vault.'+k)||'null'),SS=(k,v)=>localStorage.setItem('vault.'+k,JSON.stringify(v));
let server=null,st=Object.assign({budget:1900,goal:600,edits:{},deleted:{},manual:[]},LS('state')||{}),filt='All',query='',cycOff=0,selDay=null;
const save=()=>SS('state',st);
const buzz=(n=8)=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const f2=n=>(n<0?'-':'')+'$'+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date()),D0=()=>new Date(new Date().toDateString());
function cycleOf(off=0){const n=new Date();let m=n.getMonth();if(n.getDate()<28)m--;m+=off;const s=new Date(n.getFullYear(),m,28),e=new Date(n.getFullYear(),m+1,28);return{s:ymd(s),e:ymd(e),sd:s,ed:e}}
const days=(a,b)=>Math.round((b-a)/864e5);
const fmtD=s=>new Date(s+'T00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
function dayTitle(s){const d=days(new Date(s+'T00:00'),D0());if(d==0)return'Today';if(d==1)return'Yesterday';return new Date(s+'T00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'})}
// data
function all(){if(!server)return[];const m=new Map();for(const t of server.transactions)m.set(t.id,{...t,src:'bank'});
 const bk=new Set(server.transactions.map(t=>t.date+t.merchant+t.amount+t.type));
 for(const t of st.manual){if(t.id[0]=='s'&&bk.has(t.date+t.merchant+t.amount+t.type))continue;m.set(t.id,{...t})}
 const o=[];for(const[id,t]of m){if(st.deleted[id]||t.voided)continue;o.push(Object.assign(t,st.edits[id]||{}))}
 return o.sort((a,b)=>b.date.localeCompare(a.date)||(b.seq||0)-(a.seq||0))}
const inC=(t,c)=>t.date>=c.s&&t.date<c.e;
const label=t=>t.desc||t.merchant||(t.type=='refund'?'Refund':'No merchant');
// parser (mirrors build_data.py)
const RULES=[[/MCDONA|HUNGRY|MAMAK|HONGTA|HANU|HURRIC|CHEFS|ZENGO|STELLI|KFC|SUSHI/,'Food',0],[/COLES|WOOLWO|UMALL|ALDI|IGA/,'Groceries',0],[/UBER|TFNSW|OPAL|DIDI/,'Transport',0],[/CHEMIS|PHARMA|PRICELINE/,'Health',0],[/VODAFO|OPTUS|TELSTRA/,'Bills',0],[/HYATT|GATHER|JR MOC|DL SUN|SUNGRO/,'Food',1],[/IGLU/,'Bills',1],[/PAYPAL|WWW\./,'Shopping',1]];
function cat(m){if(!m)return['Subscription',1];for(const[r,c,u]of RULES)if(r.test(m.toUpperCase()))return[c,u];return['Other',1]}
const DR='(\\d{4})年(\\d{1,2})月(\\d{1,2})日';
function parseOne(t){if(/验证码|校验码|交易码|Enter the code/.test(t))return null;let m,o;const dd=(y,a,b)=>`${y}-${a.padStart(2,'0')}-${b.padStart(2,'0')}`;

async function decrypt(enc,pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.iter,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},k,b64(enc.ct))))}
let ENC=null;
async function refresh(){try{ENC=await(await fetch('data.enc.json?'+Date.now(),{cache:'no-store'})).json();SS('enc',ENC)}catch(e){ENC=ENC||LS('enc')}
 if(!ENC){server={transactions:[]};render();return}const pw=LS('pw');if(pw){try{server=await decrypt(ENC,pw);render();return}catch(e){}}$('lock').classList.add('on')}
async function unlock(){try{server=await decrypt(ENC,$('pw').value);SS('pw',$('pw').value);$('lock').classList.remove('on');render();buzz(12)}catch(e){$('pwErr').textContent='Wrong passphrase';buzz(30)}}
$('pw').onkeydown=e=>{if(e.key=='Enter')unlock()};
